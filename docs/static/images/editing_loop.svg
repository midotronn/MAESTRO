<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" width="100%" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5a6272"/></marker><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4ce0"/><stop offset="1" stop-color="#9b3fd4"/></linearGradient></defs><rect width="1160" height="340" fill="#ffffff"/><text x="580.0" y="34" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="17" font-weight="800" fill="#1a2030" text-anchor="middle">The natural-language editing agent</text><text x="580.0" y="55" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="12.5" font-weight="500" fill="#5a6272" text-anchor="middle">a planner-executor loop refines any window until it meets the goals you asked for</text><rect x="28" y="108" width="196" height="92" rx="14" fill="#f5f6fb" stroke="#e4e7f0" stroke-width="1.5"/><text x="126.0" y="143.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="14.5" font-weight="700" fill="#1a2030" text-anchor="middle">You</text><text x="126.0" y="161.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">pick a time window +</text><text x="126.0" y="176.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">describe the change</text><text x="126" y="220" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#8b93a7" text-anchor="middle" font-style="italic">“calmer, but keep it</text><text x="126" y="234" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#8b93a7" text-anchor="middle" font-style="italic">tight to the beat”</text><rect x="252" y="108" width="210" height="92" rx="14" fill="#f3effe" stroke="#6c4ce0" stroke-width="1.5"/><rect x="252" y="108" width="6" height="92" rx="3" fill="#6c4ce0"/><rect x="255" y="108" width="3" height="92" fill="#f3effe"/><text x="357.0" y="128" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="9.5" font-weight="700" fill="#6c4ce0" text-anchor="middle">LLM</text><text x="357.0" y="142" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="14.5" font-weight="700" fill="#6c4ce0" text-anchor="middle">Planner</text><text x="357.0" y="160" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">declare the goals,</text><text x="357.0" y="175" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">plan the tool steps</text><rect x="490" y="108" width="210" height="92" rx="14" fill="#ffffff" stroke="#e4e7f0" stroke-width="1.5"/><rect x="490" y="108" width="6" height="92" rx="3" fill="#1aa79a"/><rect x="493" y="108" width="3" height="92" fill="#ffffff"/><text x="595.0" y="143.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="14.5" font-weight="700" fill="#1a2030" text-anchor="middle">Executor</text><text x="595.0" y="161.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">apply the motion tools,</text><text x="595.0" y="176.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">reject any regression</text><rect x="728" y="108" width="174" height="92" rx="14" fill="#ffffff" stroke="#e4e7f0" stroke-width="1.5"/><text x="815.0" y="143.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="14.5" font-weight="700" fill="#1a2030" text-anchor="middle">Verify</text><text x="815.0" y="161.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">measure every</text><text x="815.0" y="176.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#5a6272" text-anchor="middle">requested goal</text><rect x="930" y="118" width="156" height="72" rx="14" fill="url(#brandg)" stroke="#6c4ce0" stroke-width="1.5"/><text x="1008.0" y="151.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Refined window</text><text x="1008.0" y="169.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="11" font-weight="500" fill="#ede9fb" text-anchor="middle">+ checkpoint</text><path d="M 224 154.0 L 252 154.0" fill="none" stroke="#5a6272" stroke-width="2" marker-end="url(#ah)"/><path d="M 462 154.0 L 490 154.0" fill="none" stroke="#5a6272" stroke-width="2" marker-end="url(#ah)"/><path d="M 700 154.0 L 728 154.0" fill="none" stroke="#5a6272" stroke-width="2" marker-end="url(#ah)"/><path d="M 902 154.0 L 930 159.0" fill="none" stroke="#1aa79a" stroke-width="2" marker-end="url(#ah)"/><text x="916.0" y="146.0" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">goals met</text><path d="M 815 108 C 586.0 64 586.0 64 357 108" fill="none" stroke="#6c4ce0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="586" y="96" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#6c4ce0" text-anchor="middle">short of goal → refine (with feedback)</text><text x="294" y="255" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="700" fill="#8b93a7" text-anchor="end">tools</text><rect x="312" y="243" width="50" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="337.2" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">energy</text><rect x="370.4" y="243" width="76" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="408.4" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">beat-align</text><rect x="454.4" y="243" width="50" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="479.59999999999997" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">smooth</text><rect x="512.8" y="243" width="57" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="541.1999999999999" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">sharpen</text><rect x="577.5999999999999" y="243" width="50" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="602.8" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">mirror</text><rect x="635.9999999999999" y="243" width="76" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="673.9999999999999" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">retrograde</text><rect x="719.9999999999999" y="243" width="76" height="22" rx="11" fill="#f5f6fb" stroke="#e4e7f0"/><text x="757.9999999999999" y="258" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="600" fill="#5a6272" text-anchor="middle">regenerate</text><text x="312" y="284" font-family="system-ui,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="10.5" font-weight="500" fill="#8b93a7" text-anchor="start">guardrail: no step may worsen the goal it targets; on failure the plan is refined, not shipped</text></svg>
