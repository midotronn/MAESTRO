<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentLODGE - Interactive Dance Editor</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>AgentLODGE <span class="sub">interactive dance editor</span></h1>
  <div class="toolbar">
    <label>Song
      <select id="song"></select>
    </label>
    <span id="genkind" class="pill" title="candidate source"></span>
    <button id="undo" disabled>&#8630; Undo</button>
    <button id="redo" disabled>Redo &#8631;</button>
  </div>
</header>

<main>
  <section class="stage">
    <video id="video" controls preload="auto"></video>

    <div class="timeline" id="timeline">
      <div class="beats" id="beats"></div>
      <div class="selection" id="selection"></div>
      <div class="playhead" id="playhead"></div>
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="hint">Drag on the bar to select the section you want to edit. The shaded band is the
      edit window.</div>

    <div class="editbar">
      <div class="win">window
        <input type="number" id="aSec" step="0.1" min="0" /> s to
        <input type="number" id="bSec" step="0.1" min="0" /> s
      </div>
      <input type="text" id="instruction" placeholder="e.g. make this more energetic / more on beat / calmer / smoother / reverse this" />
      <button id="apply" class="primary">Apply edit</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <aside class="side">
    <div class="panel">
      <h2>Edit progress</h2>
      <div id="goal" class="goal"></div>
      <div class="progwrap"><div id="progbar" class="progbar"></div></div>
      <div id="progtext" class="mono small"></div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div class="panel">
      <h2>Window metrics <span class="small">(before &#8594; after)</span></h2>
      <table id="metrics" class="metrics"></table>
    </div>

    <div class="panel">
      <h2>History</h2>
      <ol id="history" class="history"></ol>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
