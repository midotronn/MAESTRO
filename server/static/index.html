<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentLODGE — Dance Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <!-- ─────────────── top bar ─────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <span class="brand-name">AgentLODGE</span>
      <span class="brand-sub">dance editor</span>
    </div>
    <div class="tools">
      <label class="song">
        <span>Song</span>
        <select id="song"></select>
      </label>
      <span id="genkind" class="badge">—</span>
      <div class="hist-btns">
        <button id="undo" class="icon-btn" title="Undo" disabled>↶</button>
        <button id="redo" class="icon-btn" title="Redo" disabled>↷</button>
      </div>
    </div>
  </header>

  <!-- ─────────────── main ─────────────── -->
  <main class="grid">
    <!-- left: viewer + timeline + prompt -->
    <section class="stage-col">
      <div class="viewer">
        <video id="video" playsinline preload="auto"></video>
        <span class="viewer-tag">preview · base take</span>
      </div>

      <div class="tl-wrap">
        <div class="timeline" id="timeline">
          <div class="beats" id="beats"></div>
          <div class="selection" id="selection"></div>
          <div class="playhead" id="playhead"></div>
          <div class="ticks" id="ticks"></div>
        </div>
        <div class="tl-hint">Drag across the bar to pick the section to edit · the shaded band is your window</div>
      </div>

      <div class="prompt">
        <div class="win">
          <span>window</span>
          <input type="number" id="aSec" step="0.1" min="0" /><i>–</i>
          <input type="number" id="bSec" step="0.1" min="0" /><span>s</span>
        </div>
        <input type="text" id="instruction" class="instr"
               placeholder="Describe the change…  e.g. make this calmer / more energetic / more on beat" />
        <button id="apply" class="apply">Apply edit</button>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <!-- right: progress · metrics · history -->
    <aside class="side-col">
      <div class="card">
        <div class="card-h"><span class="dot-h"></span>Edit progress</div>
        <div id="goal" class="goal muted">Select a window and describe an edit to begin.</div>
        <div class="progwrap"><div id="progbar" class="progbar"></div></div>
        <div id="progtext" class="mono tiny muted"></div>
        <div id="feedback" class="feedback"></div>
      </div>

      <div class="card">
        <div class="card-h">Window metrics</div>
        <table id="metrics" class="metrics"></table>
      </div>

      <div class="card grow">
        <div class="card-h">History</div>
        <ol id="history" class="history"></ol>
      </div>
    </aside>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
