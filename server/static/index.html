<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAESTRO Dance Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <!-- ─────────────── top bar ─────────────── -->
  <header class="topbar">
    <div class="brand" title="MAESTRO: Motion Agent for Editing, Synchronized, Text-driven Reasoning & Orchestration">
      <span class="logo">◈</span>
      <span class="brand-name">MAESTRO</span>
      <span class="brand-sub">agentic dance editor</span>
      <span id="genbadge" class="genbadge" title="">offline</span>
    </div>
    <div class="tools">
      <label class="song">
        <span>Song</span>
        <select id="song"></select>
      </label>
      <button id="uploadBtn" class="ghost-btn" title="Upload your own song (processed on the GPU pod)">＋ Upload</button>
      <input type="file" id="uploadInput" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg" hidden />
      <div class="hist-btns">
        <button id="undo" class="icon-btn" title="Undo" disabled>↶</button>
        <button id="redo" class="icon-btn" title="Redo" disabled>↷</button>
      </div>
    </div>
  </header>

  <!-- ─────────────── main ─────────────── -->
  <main class="grid">
    <!-- left: viewer + timeline + prompt -->
    <section class="stage-col">
      <div class="viewer">
        <video id="video" controls playsinline preload="auto"></video>
        <span class="viewer-tag" id="viewerTag">preview · base take</span>
        <div class="render-ctl">
          <select id="renderScope" class="render-scope" title="What to render">
            <option value="window">edited window (fast)</option>
            <option value="full">full dance + music</option>
          </select>
          <button id="renderBtn" class="render-btn" title="Render the edited dance on the GPU (Blender)">🎬 Render</button>
        </div>
        <div id="renderStatus" class="render-status"></div>
      </div>

      <div class="tl-wrap">
        <div class="timeline" id="timeline">
          <div class="beats" id="beats"></div>
          <div class="selection" id="selection"></div>
          <div class="playhead" id="playhead"></div>
          <div class="ticks" id="ticks"></div>
        </div>
        <div class="tl-hint">Drag across the bar to pick the section to edit · the shaded band is your window</div>
      </div>

      <div class="prompt">
        <div class="win">
          <span>window</span>
          <input type="number" id="aSec" step="0.1" min="0" /><i>–</i>
          <input type="number" id="bSec" step="0.1" min="0" /><span>s</span>
        </div>
        <input type="text" id="instruction" class="instr"
               placeholder="Describe any change in your own words…  e.g. 'calmer but keep it tight to the beat', 'explosive hits on the drop', 'flip and reverse this'" />
        <button id="apply" class="apply">Apply edit</button>
      </div>
    </section>

    <!-- right: progress · metrics · history -->
    <aside class="side-col">
      <div class="card">
        <div class="card-h"><span class="dot-h"></span>Agent edit</div>
        <div id="goal" class="goal muted">Describe any change in plain English, the agent plans it, checks every goal, and refines.</div>
        <div class="progwrap"><div id="progbar" class="progbar"></div></div>
        <div id="progtext" class="mono tiny muted"></div>
        <div id="checks" class="checks"></div>
        <div id="feedback" class="feedback"></div>
        <details id="reasoning" class="reasoning" hidden>
          <summary>Agent reasoning</summary>
          <div id="reasoningBody" class="reasoning-body"></div>
        </details>
      </div>

      <div class="card">
        <div class="card-h">Window metrics</div>
        <table id="metrics" class="metrics"></table>
      </div>

      <div class="card grow">
        <div class="card-h">History</div>
        <ol id="history" class="history"></ol>
      </div>
    </aside>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
